apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: runboat-builds-db

resources:
  - namespace.yaml
  - storageclass.yaml
  - postgres.yaml
  - networkpolicy.yaml

# postgres.env is not committed: copy postgres.env.sample and set the password.
# It must match PGPASSWORD in RUNBOAT_BUILD_SECRET_ENV (deploy/runboat/runboat.env).
secretGenerator:
  - name: runboat-postgres
    envs:
      - postgres.env

generatorOptions:
  disableNameSuffixHash: true

