apiVersion: v1
kind: Service
metadata:
  name: postgres-nbg1
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: runboat-postgres
    runboat/location: nbg1
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-nbg1
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-runboat-postgres-local
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-nbg1
spec:
  serviceName: postgres-nbg1
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runboat-postgres
      runboat/location: nbg1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runboat-postgres
        runboat/location: nbg1
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: nbg1
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:14
          envFrom:
            - secretRef:
                name: runboat-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d postgres
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d postgres
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-nbg1
---
