apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: runboat-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-runboat-postgres-local
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runboat-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runboat-postgres
    spec:
      # Pinned to the database node. The volume is strict-local, so the pod can only
      # ever run where its data lives. Set the node name here.
      nodeSelector:
        kubernetes.io/hostname: dedicado-ovh-gra2
      tolerations:
        - key: "runboat"
          operator: "Exists"
          effect: "NoSchedule"
        # The database node is a control-plane node.
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:14
          args:
            # Builds are disposable: trade durability for fast database creation.
            - -c
            - max_connections=300
            - -c
            - shared_buffers=256MB
            - -c
            - synchronous_commit=off
          envFrom:
            - secretRef:
                name: runboat-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d postgres']
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d postgres']
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres
