apiVersion: apps/v1
kind: Deployment
metadata:
  name: runboat
  namespace: runboat-controller
spec:
  # One and only one controller process is supported.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: runboat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runboat
    spec:
      serviceAccountName: runboat
      # ghcr.io/zverp/runboat is private. Create once with:
      #   kubectl -n runboat-controller create secret docker-registry ghcr-pull \
      #     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT read:packages>
      imagePullSecrets:
        - name: ghcr-pull
      tolerations:
        # Single-node cluster: runs on the control-plane node.
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: runboat
          image: ghcr.io/zverp/runboat:main
          imagePullPolicy: Always
          # All RUNBOAT_* settings. No KUBECONFIG: the in-cluster service account is used.
          envFrom:
            - secretRef:
                name: runboat
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
