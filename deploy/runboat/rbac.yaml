apiVersion: v1
kind: ServiceAccount
metadata:
  name: runboat
  namespace: runboat-controller
---
# Permissions in the builds namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runboat-controller
  namespace: runboat
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runboat-controller
  namespace: runboat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runboat-controller
subjects:
  - kind: ServiceAccount
    name: runboat
    namespace: runboat-controller
