# Volumes of the builds (template var storageClassName). Matches the class already
# present in the cluster (StorageClass parameters are immutable): one replica,
# deleted together with the build.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-runboat
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  dataLocality: best-effort
  fsType: ext4
  numberOfReplicas: "1"
  recurringJobSelector: "[]"
  staleReplicaTimeout: "30"
