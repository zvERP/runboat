apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  annotations:
    runboat/init-status: "todo"  # ask controller to initialize when there is capacity
  finalizers:
    - runboat/cleanup
spec:
  replicas: 0  # deploy idle
  selector:
    matchLabels:
      app: odoo
  template:
    metadata:
      labels:
        app: odoo
      annotations:
        kubectl.kubernetes.io/default-container: odoo
    spec:
      tolerations:
        - key: "runboat"
          operator: "Exists"
          effect: "NoSchedule"
        # Single-node cluster: builds run on the control-plane node.
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      # let Odoo stop gracefully to disconnect from postgres
      terminationGracePeriodSeconds: 10
      enableServiceLinks: false
      containers:
        - name: odoo
          image: odoo
          volumeMounts:
            - name: runboat-scripts
              mountPath: /runboat
            - name: data
              mountPath: /mnt/data
            - name: data
              mountPath: /opt/odoo-venv
              subPath: odoo-venv
          envFrom:
            - secretRef:
                name: odoosecretenv
            - configMapRef:
                name: odooenv
          ports:
            - name: web
              containerPort: 8069
          # Ready as soon as Odoo listens; liveness only kicks in after startup, so a
          # slow first start is never killed.
          startupProbe:
            tcpSocket:
              port: 8069
            periodSeconds: 1
            failureThreshold: 180
          readinessProbe:
            tcpSocket:
              port: 8069
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 8069
            periodSeconds: 30
          args: ["bash", "/runboat/runboat-start.sh"]
          # Reserve almost nothing (builds are idle most of the time), but allow a
          # large CPU burst so startup and first page loads are fast.
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1536Mi
        - name: mailhog
          image: mailhog
          env:
            - name: MH_API_BIND_ADDR
              value: 0.0.0.0:8025
            - name: MH_UI_BIND_ADDR
              value: 0.0.0.0:8025
            - name: MH_SMTP_BIND_ADDR
              value: 0.0.0.0:1025
          ports:
            - name: smtp
              containerPort: 1025
            - name: mailhog-web
              containerPort: 8025
          readinessProbe:
            tcpSocket:
              port: 8025
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 8025
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: runboat-scripts
          configMap:
            name: runboat-scripts
        - name: data
          persistentVolumeClaim:
            claimName: data
