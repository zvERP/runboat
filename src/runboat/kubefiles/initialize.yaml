apiVersion: batch/v1
kind: Job
metadata:
  name: initialize
  labels:
    runboat/job-kind: initialize
spec:
  template:
    metadata:
      labels:
        runboat/job-kind: initialize
    spec:
      enableServiceLinks: false
      tolerations:
        - key: "runboat"
          operator: "Exists"
          effect: "NoSchedule"
        # Single-node cluster: builds run on the control-plane node.
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: initialize
          image: odoo
          volumeMounts:
            - name: runboat-scripts
              mountPath: /runboat
            - name: data
              mountPath: /mnt/data
          envFrom:
            - secretRef:
                name: odoosecretenv
            - configMapRef:
                name: odooenv
          args: ["bash", "/runboat/runboat-initialize.sh"]
          # Heaviest step (pip install + module install). Small request so jobs get
          # scheduled immediately, high limit so they finish fast.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: runboat-scripts
          configMap:
            name: runboat-scripts
        - name: data
          persistentVolumeClaim:
            claimName: data
      restartPolicy: Never
  completions: 1
  backoffLimit: 0
  activeDeadlineSeconds: 1200
